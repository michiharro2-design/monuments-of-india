<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monuments of India</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h2>Monuments of India</h2>
    </header>

    <div class="container">

        <div class="monument">
            <img src="taj.jfif" alt="Taj Mahal">
            <h3>Taj Mahal, Agra</h3>
        </div>

        <div class="monument">
            <img src="redfort.jfif" alt="Red Fort">
            <h3>Red Fort, Delhi</h3>
            <ul>
                <li>Location: New Delhi</li>
                <li>Built in 1639–48</li>
                <li>Built for Mughal Empire</li>
            </ul>
        </div>

        <div class="monument">
            <img src="gateway.jfif" alt="India Gate">
            <h3>Name and Information about the monument</h3>
        </div>

        <div class="monument">
            <img src="qutub.jfif" alt="Qutub Minar">
            <h3>Name and Information about the monument</h3>
        </div>

        <div class="monument">
            <img src="lotus.jfif" alt="Lotus Temple">
            <h3>Name and Information about the monument</h3>
        </div>

        <div class="monument">
            <img src="hampi.jfif" alt="Stone Chariot at Hampi">
            <h3>Name and Information about the monument</h3>
        </div>

    </div>

</body>
</html>
